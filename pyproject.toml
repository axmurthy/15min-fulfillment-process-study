[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsim"
version = "0.1.0"
description = "Discrete-event simulation of a 15-minute grocery fulfillment process"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "simpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
